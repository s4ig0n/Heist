# Render Blueprint for the Heist web app. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: heist
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/replays
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: HEIST_RUN_TOKEN
        generateValue: true
      - key: NIMBUS_MODEL
        value: gemini-3.1-flash-lite
